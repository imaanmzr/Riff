[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riff-workflow"
version = "0.8.0"
description = "Plan, execute, review and resume engineering work across agent hosts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Iman Mazreati"}]

[project.urls]
Repository = "https://github.com/imaanmzr/Riff"
Issues = "https://github.com/imaanmzr/Riff/issues"

[project.scripts]
riff = "distribution.riff:cli"

[tool.setuptools]
packages = ["distribution"]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.package-data]
distribution = ["LICENSE", "skills/**/*", "assets/*"]
